name: "ci (manual)"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (takes precedence over 'ref' if set)"
        required: false
        type: string
      ref:
        description: "Branch or SHA to test (ignored if 'pr_number' is set)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ inputs.pr_number || inputs.ref }}"
  cancel-in-progress: true

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  resolve-ref:
    name: "resolve target ref"
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: "resolve target ref"
        id: resolve
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/${PR_NUMBER}/merge"
          elif [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          else
            echo "::error::Provide either 'pr_number' or 'ref'." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "### Testing ref: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

  spec:
    name: "spec (${{ matrix.runs_on }} ruby ${{ matrix.ruby_version }} | puppet ${{matrix.puppet_gem_version}})"
    needs: resolve-ref
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - "3.2"
          - "4.0"
        include:
          - ruby_version: '3.2'
            puppet_gem_version: '~> 8.0'
          - ruby_version: '4.0'
            puppet_gem_version: '~> 9.0'
        runs_on:
          - "ubuntu-latest"
          - "windows-latest"
    uses: "puppetlabs/cat-github-actions/.github/workflows/gem_ci.yml@main"
    secrets: "inherit"
    with:
      rake_task: "spec:coverage"
      ruby_version: ${{ matrix.ruby_version }}
      puppet_gem_version: ${{ matrix.puppet_gem_version }}
      runs_on: ${{ matrix.runs_on }}
      ref: ${{ needs.resolve-ref.outputs.ref }}

  acceptance:
    needs: ["resolve-ref", "spec"]
    strategy:
      matrix:
        ruby_version:
          - "3.2"
          - "4.0"
        include:
          - ruby_version: '3.2'
            puppet_gem_version: 'https://github.com/puppetlabs/puppet' # puppet8'
          - ruby_version: '4.0'
            puppet_gem_version: '~> 9.0'
        runs_on:
          - "ubuntu-latest"
          - "windows-latest"
    uses: "puppetlabs/cat-github-actions/.github/workflows/gem_acceptance.yml@main"
    secrets: "inherit"
    with:
      ruby_version: ${{ matrix.ruby_version }}
      puppet_version: ${{ matrix.puppet_gem_version }}
      runs_on: ${{ matrix.runs_on }}
      ref: ${{ needs.resolve-ref.outputs.ref }}
